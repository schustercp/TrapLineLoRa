; =============================================================================
;  TrapLineLoRa - PlatformIO project configuration
;
;  Target hardware : Seeed Studio XIAO nRF52840 + Wio-SX1262
;                    (Kit SKU 102010710 - "XIAO nRF52840 & Wio-SX1262 Kit")
;  Framework       : Arduino (Seeed Studio nRF52 core, an Adafruit nRF52 BSP fork)
;  Radio driver    : RadioLib
;
;  Current firmware is the Phase 0 SURVEY TOOL (spec §7.9). Build two units,
;  put one in `role beacon` and carry the other in `role listen`.
;
;      pio run -e survey -t upload      # flash a survey unit
;      pio device monitor -e survey     # or just use BLE from a phone
;      pio test -e native               # unit tests, no hardware needed
;
;  Docs: https://docs.platformio.org/page/projectconf.html
; =============================================================================

[platformio]
name          = TrapLineLoRa
description   = LoRa trap line monitoring on XIAO nRF52840 + Wio-SX1262
default_envs  = survey
src_dir       = src
include_dir   = include
lib_dir       = lib
test_dir      = test

; -----------------------------------------------------------------------------
; Shared configuration for the embedded targets
; -----------------------------------------------------------------------------
[nrf52_common]
framework = arduino

; The XIAO nRF52840 board definitions are not in the official nordicnrf52
; platform, so we use maxgerhardt's fork, which adds xiaoble_adafruit /
; xiaoblesense_adafruit *and* already declares the Seeed BSP package that
; carries the Seeed_XIAO_nRF52840 variant files:
;
;   framework-arduinoadafruitnrf52-seeed:
;     https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed.git
;
; So no platform_packages override is needed here — an earlier version of this
; file pinned framework-arduinoadafruitnrf52 to Seeed's repo, which was the
; wrong package (the variant lives in the -seeed one) and re-fetched a git
; branch on every clean build for no benefit. Verified against a real build:
; PACKAGES listed framework-arduinoadafruitnrf52-seeed @ 1.10101.0.
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git

; UF2/DFU over USB. Double-tap RESET on the XIAO to force the bootloader.
upload_protocol = nrfutil

monitor_speed   = 115200
; `colorize` is not a PlatformIO filter — it warned on every run.
monitor_filters = time, send_on_enter

lib_deps =
	jgromes/RadioLib @ ^7.1.2

build_flags =
	-DCFG_DEBUG=0
	-DTRAPLINE_SERIAL_BAUD=115200

; Warnings on OUR code only. build_src_flags keeps these off the Arduino core
; and RadioLib translation units — but headers we include still inherit them,
; and the S140 SoftDevice headers alone produced 440 -Wunused-parameter
; warnings that buried the two real findings. We mark deliberate unused
; parameters with (void)x, so switching that one off costs us nothing.
build_src_flags =
	-Wall
	-Wextra
	-Wshadow
	-Wno-unused-parameter

; -----------------------------------------------------------------------------
; Survey tool - the Phase 0 firmware. Flash this to both handhelds.
; -----------------------------------------------------------------------------
[env:survey]
extends  = nrf52_common
board    = xiaoble_adafruit

; Same firmware on a XIAO nRF52840 *Sense* (adds an IMU and a PDM mic).
[env:survey_sense]
extends  = nrf52_common
board    = xiaoblesense_adafruit

; -----------------------------------------------------------------------------
; Native unit tests - AES/CMAC, TLP framing, link maths. No hardware, no radio.
; Only the Arduino-free translation units are compiled here; that separation is
; deliberate and worth preserving as the protocol grows.
; -----------------------------------------------------------------------------
[env:native]
platform         = native
test_framework   = unity
; gnu++11 deliberately: that is what the Adafruit nRF52 builder uses on the
; target (adafruit.py CXXFLAGS). Testing the shared core at a newer standard
; than it ships under would let C++14/17 constructs pass here and fail there.
build_flags      = -std=gnu++11 -Wall -Wextra -Wshadow
build_src_filter = -<*> +<aes128.cpp> +<tlp.cpp> +<link_math.cpp>

; Without this PlatformIO builds only test/, and the test binary fails to link
; against everything in src/. Defaults to `no`, which is the right default for
; projects whose src/ is one big main.cpp — but ours is deliberately split so
; the protocol core can be tested off-target.
test_build_src   = yes
